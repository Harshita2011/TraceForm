name: PostgreSQL container deployment verification

on:
  workflow_dispatch:
  pull_request:
    paths: ['traceform/**', 'scripts/verify*postgres.py', 'scripts/verify_docker.py', '.github/workflows/postgres-deployment.yml']

permissions:
  contents: read

jobs:
  compose-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate isolated verification credentials
        run: |
          python -m pip install cryptography
          python - <<'PY'
          import secrets
          from pathlib import Path
          from cryptography.fernet import Fernet
          destination = Path('.runtime/pg-verification/compose.env')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text('\n'.join([
              'POSTGRES_PASSWORD=' + secrets.token_hex(32),
              'API_KEYS=' + secrets.token_hex(32) + ':verification:admin',
              'TRACEFORM_MASTER_KEY=' + Fernet.generate_key().decode(),
              'API_PORT=18000',
          ]) + '\n')
          PY
      - name: Build and start production services
        run: docker compose --project-name traceform-pgverify --env-file .runtime/pg-verification/compose.env -f traceform/docker-compose.yml up -d --build
      - name: Run database, pipeline and restart checks
        run: python scripts/verify_docker.py --env-file .runtime/pg-verification/compose.env
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-deployment-results
          path: |
            .runtime/docker-verification/report.json
            .runtime/docker-verification/production-smoke-report.json
            .runtime/docker-verification/pytest-*.log
            .runtime/docker-verification/production-smoke.log
      - name: Stop verification services
        if: always()
        run: docker compose --project-name traceform-pgverify --env-file .runtime/pg-verification/compose.env -f traceform/docker-compose.yml down
