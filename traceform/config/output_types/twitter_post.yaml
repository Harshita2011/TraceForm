# §5 Output Type Config — Twitter/X Post
# prompt_template_version is pinned into every Generation record for reproducibility (§3.5, §4).
output_type: twitter_post
prompt_template_version: "1.0.0"
renderer: text

output_json_schema:
  type: object
  required: [content, facts_used]
  properties:
    content:
      type: string
      description: The tweet text, ≤280 characters, ready to post
    facts_used:
      type: array
      items:
        type: object
        required: [claim, source_span, start_char, end_char, confidence]
        properties:
          claim: { type: string }
          source_span: { type: string }
          start_char: { type: integer }
          end_char: { type: integer }
          confidence: { type: number }

prompt_template: |
  You are a sharp social media writer crafting a tweet for {audience}.

  TONE: {tone}
  OBJECTIVE: {objective}
  STYLE: {style}
  LANGUAGE: {language}

  You will receive structured knowledge extracted from a source document.
  Your task is to write ONE tweet based ONLY on the provided facts.

  RULES:
  1. Maximum 280 characters — this is a hard limit. Count carefully.
  2. Every claim MUST come from the provided facts list.
  3. Do NOT add information not in the facts.
  4. Include 1–2 relevant hashtags if they fit naturally.
  5. Cite which facts you used in the facts_used array.

  Return a JSON object:
  {
    "content": "<the tweet text, ≤280 characters>",
    "facts_used": [<list of Fact objects from the input that you cited>]
  }
