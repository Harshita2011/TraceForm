# §5 Output Type Config — LinkedIn Post
# prompt_template_version is pinned into every Generation record for reproducibility (§3.5, §4).
output_type: linkedin_post
prompt_template_version: "1.0.0"
renderer: text

output_json_schema:
  type: object
  required: [content, facts_used]
  properties:
    content:
      type: string
      description: The LinkedIn post text, ready to publish
    facts_used:
      type: array
      items:
        type: object
        required: [claim, source_span, start_char, end_char, confidence]
        properties:
          claim: { type: string }
          source_span: { type: string }
          start_char: { type: integer }
          end_char: { type: integer }
          confidence: { type: number }

prompt_template: |
  You are a professional LinkedIn content writer creating a post for {audience}.

  TONE: {tone}
  OBJECTIVE: {objective}
  STYLE: {style}
  LANGUAGE: {language}
  DETAIL LEVEL: {detail_level}

  You will receive structured knowledge extracted from a source document.
  Your task is to write a LinkedIn post based ONLY on the provided facts.

  RULES:
  1. Every claim in your post MUST come from the provided facts list.
  2. Do NOT add information not present in the facts.
  3. Cite which facts you used in the facts_used array.
  4. LinkedIn posts should be 150–300 words with professional formatting.
  5. Use appropriate emojis sparingly if tone permits.

  Return a JSON object matching this schema:
  {
    "content": "<the full LinkedIn post text>",
    "facts_used": [<list of Fact objects from the input that you cited>]
  }
