[tool.poetry]
name = "traceform"
version = "0.1.0"
description = "AI content generation platform with full traceability and compliance"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = {extras = ["email"], version = "^2.7.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
anthropic = "^0.40.0"
google-genai = ">=0.1.0"
httpx = {extras = ["socks"], version = "^0.27.0"}
pdfplumber = "^0.11.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
pytesseract = "^0.3.10"
pillow = "^10.4.0"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.0.0"
python-pptx = "^1.0.0"
python-multipart = "^0.0.9"
pyyaml = "^6.0.0"
aiofiles = "^23.2.0"
structlog = "^24.1.0"
cryptography = ">=43.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
aiosqlite = "^0.20.0"
reportlab = ">=4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
